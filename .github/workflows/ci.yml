name: CI

# Runs the JVM unit tests and builds the debug APK on every push and PR.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --console=plain assembleDebug
